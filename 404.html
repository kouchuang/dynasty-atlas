<style>
  :root {
    --ink: #101a16;
    --paper: #f5f1e8;
    --gold: #c8ad79;
    --cinnabar: #9d4033;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    padding: 32px;
    background:
      radial-gradient(ellipse at 72% 18%, rgba(200, 173, 121, .16), transparent 34%),
      linear-gradient(145deg, #17231e, #0b1210);
    color: var(--paper);
    font-family: "Songti SC", "STSong", "Noto Serif CJK SC", "SimSun", serif;
    text-align: center;
  }
  main { max-width: 540px; }
  .seal {
    display: grid;
    place-items: center;
    width: 54px;
    height: 54px;
    margin: 0 auto 24px;
    border: 1px solid rgba(208, 123, 101, .75);
    color: #d77863;
    font-family: "Kaiti SC", "STKaiti", "KaiTi", serif;
    font-size: 28px;
    transform: rotate(-3deg);
  }
  .eyebrow { margin: 0 0 14px; color: var(--gold); font-family: "PingFang SC", sans-serif; font-size: 10px; letter-spacing: .24em; }
  h1 { margin: 0; font-size: clamp(34px, 7vw, 56px); font-weight: 400; letter-spacing: .08em; line-height: 1.2; }
  p { margin: 19px 0 30px; color: rgba(245, 241, 232, .72); font-size: 14px; line-height: 2; }
  a {
    display: inline-block;
    padding: 11px 20px;
    border: 1px solid rgba(200, 173, 121, .46);
    color: var(--paper);
    font-family: "PingFang SC", sans-serif;
    font-size: 13px;
    text-decoration: none;
    transition: background .2s, border-color .2s;
  }
  a:hover { background: rgba(200, 173, 121, .12); border-color: var(--gold); }
</style>
</head>
